name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build + lint + test + check:exports (contracts run in the contracts job)
        run: pnpm turbo run build lint test check:exports --filter=!@amanah/contracts

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge build
        run: forge build
        working-directory: packages/contracts

      - name: Forge test
        run: forge test
        working-directory: packages/contracts

      # Guard against committed-codegen drift: regenerate @amanah/shared from the committed
      # ledger (deployments/<chain>.json) + freshly built out/ ABIs, and fail if the result
      # differs from what's checked in. Catches stale addresses/ABIs that still compile but
      # point consumers at the wrong contracts.
      - name: Check shared exports are in sync
        run: node script/export-shared.mjs && git diff --exit-code ../shared/src
        working-directory: packages/contracts
