# Full-stack orchestration for the VPS. Testnet + mocks only.
# Secrets come from the host environment / an untracked .env — never committed.
# See docker-compose.example.env for the required variable names.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amanah
      # Required from the host .env — compose fails fast rather than booting with a
      # weak, repo-known default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: amanah
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host — services reach Postgres over the compose network.
    # For host psql while debugging, add:  ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amanah -d amanah"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: applies pending migrations, then exits. api/indexer gate on its
  # success so they never race an empty/not-ready schema on first boot. Reuses the
  # api image (which carries pnpm + the prisma CLI + schema + migrations) with a
  # command override — no second build.
  migrate:
    image: amanah-api:local
    # Same build as `api` so `migrate` is self-sufficient on any path (compose dedupes
    # the identical build to one image — no double build). Without this, `docker compose
    # run --rm migrate` / `up migrate` before an `api` build would try to pull the tag.
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["pnpm", "--filter", "@amanah/db", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://amanah:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}@postgres:5432/amanah
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Inlined into the bundle + CSP at BUILD time; a change ⇒ rebuild (deploy.sh --build).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID: ${NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID:?set NEXT_PUBLIC_DYNAMIC_ENVIRONMENT_ID in .env}
        NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL: ${NEXT_PUBLIC_BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
    environment:
      NODE_ENV: production
      # Server-only (NOT NEXT_PUBLIC): app/api/route uses these to reach the agent.
      AGENT_URL: http://agent:5000
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?set AGENT_SHARED_SECRET in .env}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
      agent:
        condition: service_healthy

  landing:
    build:
      context: .
      dockerfile: docker/landing.Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env}
    expose:
      - "80"

  api:
    image: amanah-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      # connection_limit=10: each /ledger request fans out ~3 concurrent queries,
      # so ~3 concurrent ledger requests approach the pool ceiling — raise for load.
      DATABASE_URL: postgresql://amanah:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}@postgres:5432/amanah?connection_limit=10
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    expose:
      - "4000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  indexer:
    build:
      context: .
      dockerfile: docker/indexer.Dockerfile
    environment:
      DATABASE_URL: postgresql://amanah:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}@postgres:5432/amanah?connection_limit=3
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      # Set low (e.g. 2) in the demo .env so seeded/live-fired events surface
      # inside the 90-second demo window; keep 15 for a production-grade feed.
      INDEXER_CONFIRMATIONS: ${INDEXER_CONFIRMATIONS:-15}
    # Worker: no HTTP port.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env (agent requires it at boot)}
      # Internal-only: reached by api/web over the compose network, never via Caddy.
      API_URL: http://api:4000
      # MUST equal web's AGENT_SHARED_SECRET (same .env var) or /api/route 401s.
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?set AGENT_SHARED_SECRET in .env}
    expose:
      - "5000"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"require('net').connect(5000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  # On-demand demo seeder — not started by `up`: `docker compose run --rm seed`
  # (wrapped by `pnpm seed:demo`). Runs the on-chain forge script (external RPC) and the
  # offchain prisma seed, which writes campaign metadata + rails straight to Postgres.
  # No API coupling: it talks to Postgres directly, not via the api HTTP service.
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: docker/seed.Dockerfile
    command: ["bash", "scripts/seed-demo.sh"]
    environment:
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      DEPLOYER_PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY:?set DEPLOYER_PRIVATE_KEY in .env}
      DATABASE_URL: postgresql://amanah:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}@postgres:5432/amanah
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - landing
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
