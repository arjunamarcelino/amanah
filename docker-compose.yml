# Full-stack orchestration for the VPS. Testnet + mocks only.
# Secrets come from the host environment / an untracked .env — never committed.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amanah
      # Required from the host .env — compose fails fast rather than booting with a
      # weak, repo-known default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: amanah
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bind to loopback only — not world-reachable on the VPS. Services reach it
    # over the compose network; local psql still works via 127.0.0.1.
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      - api
      - agent

  landing:
    build:
      context: .
      dockerfile: docker/landing.Dockerfile
    expose:
      - "80"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      # connection_limit=10: each /ledger request fans out ~3 concurrent queries,
      # so ~3 concurrent ledger requests approach the pool ceiling — raise for load.
      DATABASE_URL: postgresql://amanah:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}@postgres:5432/amanah?connection_limit=10
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    expose:
      - "4000"
    depends_on:
      - postgres

  indexer:
    build:
      context: .
      dockerfile: docker/indexer.Dockerfile
    environment:
      DATABASE_URL: postgresql://amanah:${POSTGRES_PASSWORD:?set a strong POSTGRES_PASSWORD in .env}@postgres:5432/amanah?connection_limit=3
      BASE_SEPOLIA_RPC_URL: ${BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
      INDEXER_CONFIRMATIONS: ${INDEXER_CONFIRMATIONS:-15}
    # Worker: no HTTP port.
    depends_on:
      - postgres

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Internal-only: reached by api/web over the compose network, never via Caddy.
      API_URL: http://api:4000
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:?set AGENT_SHARED_SECRET in .env}
    expose:
      - "5000"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - landing
      - api
      - agent

volumes:
  pgdata:
  caddy_data:
  caddy_config:
